plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Xander Maven (YACL)'
		url = 'https://maven.isxander.dev/releases'
	}
	maven {
		name = 'Terraformers (Mod Menu)'
		url = 'https://maven.terraformersmc.com/releases'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// Mod Menu is optional at runtime: compile against it, run with it in dev.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Other mod jars to run along with, e.g. to check Punchy or Iris in the game tests: -Pextra_runtime_mod=<jar>[;<jar>...].
	if (findProperty("extra_runtime_mod")) localRuntime files(findProperty("extra_runtime_mod").split(";"))
}

// Client game tests live in src/gametest and run with `./gradlew runClientGameTest`.
// They open a test world and take screenshots (run/screenshots) of every feature.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "cobblecomfort-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Cosmetic sheets: one image per wardrobe category in cosmetics/, every piece drawn on the figure (skin FLRN_tv).
// `./gradlew runCosmeticSheets` opens the game for it, but only when the cosmetics changed since the last sheets;
// every build runs it afterwards.
sourceSets {
	sheets {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	mods {
		"cobblecomfort" {
			sourceSet sourceSets.main
		}
		"cobblecomfort-sheets" {
			sourceSet sourceSets.sheets
		}
	}
	runs {
		cosmeticSheets {
			client()
			source sourceSets.sheets
			runDir "build/run/cosmeticSheets"
			ideConfigGenerated false
			property "fabric.client.gametest"
			property "fabric.client.gametest.modid", "cobblecomfort-sheets"
			property "cobblecomfort.sheets.out", file("cosmetics").absolutePath
		}
	}
}

/** A fingerprint of the files the cosmetic sheets are drawn from. */
class CosmeticSheetInputs {
	static String hash(FileCollection files) {
		def digest = java.security.MessageDigest.getInstance("SHA-256")
		files.files.findAll { it.isFile() }.sort { it.absolutePath }.each { digest.update(it.bytes) }
		return digest.digest().encodeHex().toString()
	}
}

def sheetInputs = fileTree("src/main/java/dev/cobblecomfort/features/wardrobe") + fileTree("src/main/java/dev/cobblecomfort/features/namecharm") + fileTree("src/main/java/dev/cobblecomfort/features/plush") + fileTree("src/main/java/dev/cobblecomfort/features/petplush") + fileTree("src/sheets") +
		files("src/main/resources/assets/cobblecomfort/textures/misc/badges.png", "src/main/resources/assets/cobblecomfort/textures/misc/hat.png")
def sheetStamp = file("cosmetics/.inputs")
tasks.named("runCosmeticSheets") {
	onlyIf("the cosmetics changed") { !sheetStamp.exists() || sheetStamp.text != CosmeticSheetInputs.hash(sheetInputs) }
	doLast { sheetStamp.text = CosmeticSheetInputs.hash(sheetInputs) }
}
tasks.named("build") { finalizedBy "runCosmeticSheets" }

processResources {
	def props = [
		version: project.version,
		minecraft_version: project.minecraft_version,
		loader_version: project.loader_version,
		yacl_version: project.yacl_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Copies each build into local launcher profiles (dev_profile_mods_dir in gradle.properties, ';'-separated), replacing older versions.
def devProfileModsDirs = (project.findProperty("dev_profile_mods_dir") ?: "").split(";")*.trim().findAll { it }
if (devProfileModsDirs) {
	def removeOldDevJars = tasks.register("removeOldDevJars", Delete) {
		devProfileModsDirs.each { dir -> delete fileTree(dir) { include "${project.archives_base_name}-*.jar" } }
	}
	def installDevJar = tasks.register("installDevJar") { dependsOn removeOldDevJars }
	devProfileModsDirs.eachWithIndex { dir, i ->
		def copyJar = tasks.register("installDevJar${i}", Copy) {
			dependsOn removeOldDevJars
			from tasks.named("jar").flatMap { it.archiveFile }
			into dir
		}
		installDevJar.configure { dependsOn copyJar }
	}
	tasks.named("build") { finalizedBy installDevJar }
}

// A shader pack for the game tests' screenshots (needs Iris and Sodium as extra_runtime_mod): -Ptest_shaderpack=<zip>.
if (findProperty("test_shaderpack")) {
	loom.runs.matching { it.name == "clientGameTest" }.configureEach {
		property "cobblecomfort.test.shaderpack", file(findProperty("test_shaderpack")).absolutePath
	}
}
